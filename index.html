<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Schnitzeljagd Luzern</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f5f5f0;
    --surface: #ffffff;
    --ink: #16213a;
    --muted: #5e6675;
    --line: #d7d9d2;
    --blue: #1f4fa3;
    --blue-ink: #ffffff;
    --amber: #d0901f;
    --stamp: #1f4fa3;
    --err: #b23a2e;
    --err-bg: #f8e9e6;
    --lock: #ebece6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121a2b;
      --surface: #1a2438;
      --ink: #eef0f4;
      --muted: #a2abbd;
      --line: #2e3a52;
      --blue: #6f9ae8;
      --blue-ink: #0f1626;
      --amber: #e2a94a;
      --stamp: #8fb2f2;
      --err: #f29c92;
      --err-bg: #3b2320;
      --lock: #16203200;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121a2b; --surface: #1a2438; --ink: #eef0f4; --muted: #a2abbd;
    --line: #2e3a52; --blue: #6f9ae8; --blue-ink: #0f1626; --amber: #e2a94a;
    --stamp: #8fb2f2; --err: #f29c92; --err-bg: #3b2320; --lock: #16203200;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1.1rem 4rem; }
  h1 { font-size: 2.1rem; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 .5rem; }
  h2 { font-size: 1.45rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 .4rem; }
  h3 { font-size: 1.05rem; font-weight: 700; margin: 0 0 .3rem; }
  p { margin: 0 0 .8rem; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }

  /* Top bar */
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 1rem; padding-bottom: .7rem; border-bottom: 2px solid var(--ink); margin-bottom: 1rem;
  }
  .topbar strong { font-weight: 800; }
  .score { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Transit-line progress */
  .line { position: relative; margin: 1.2rem 0 1.6rem; }
  .line .track { position: absolute; left: 10px; right: 10px; top: 9px; height: 4px; background: var(--line); border-radius: 2px; }
  .line .stops { display: flex; justify-content: space-between; position: relative; }
  .line .stop { display: flex; flex-direction: column; align-items: center; width: 33%; text-align: center; }
  .line .dot { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--line); background: var(--paper); }
  .line .stop.done .dot { background: var(--blue); border-color: var(--blue); }
  .line .stop.now .dot { border-color: var(--blue); background: var(--paper); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--blue); }
  .line .label { font-size: .8rem; margin-top: .45rem; color: var(--muted); line-height: 1.2; }
  .line .stop.now .label { color: var(--ink); font-weight: 700; }

  /* Blocks */
  .block {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--line);
    border-radius: 6px;
    padding: 1rem 1rem 1rem 1.1rem;
    margin: 0 0 1rem;
  }
  .block.active { border-left-color: var(--blue); }
  .block.locked { border-left-style: dashed; background: transparent; color: var(--muted); }
  .block.done { border-left-color: var(--stamp); }

  .stamp {
    position: absolute; top: .6rem; right: .7rem;
    transform: rotate(-7deg);
    border: 2px solid var(--stamp); color: var(--stamp);
    border-radius: 4px; padding: .1rem .45rem;
    font-size: .72rem; font-weight: 800; letter-spacing: .04em;
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: no-preference) {
    .stamp.fresh { animation: stampIn .35s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes stampIn { from { transform: rotate(-7deg) scale(1.8); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  }

  /* Form bits */
  label { display: block; font-weight: 700; margin: 0 0 .3rem; }
  input[type=text], input[type=password], input[type=tel] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: .7rem .8rem;
    border: 2px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
    margin-bottom: .6rem;
  }
  input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
  .btn {
    display: inline-block; width: 100%; font: inherit; font-weight: 800; font-size: 1.05rem;
    padding: .8rem 1rem; border-radius: 6px; border: 2px solid var(--blue);
    background: var(--blue); color: var(--blue-ink); cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 600; font-size: .95rem; }
  .row { display: flex; gap: .6rem; }
  .row .btn { width: auto; flex: 1; }
  .msg { padding: .6rem .8rem; border-radius: 6px; margin: 0 0 .7rem; font-weight: 600; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .check { display: flex; gap: .7rem; align-items: flex-start; margin: .5rem 0 .8rem; font-weight: 600; }
  .check input { width: 1.4rem; height: 1.4rem; margin: .1rem 0 0; flex: none; accent-color: var(--blue); }
  .riddle { font-size: 1.2rem; line-height: 1.45; font-weight: 600; padding: .2rem 0 .6rem; }
  .riddle.hint { border-top: 1px dashed var(--line); margin-top: .6rem; padding-top: .8rem; font-weight: 500; }
  dl { margin: 0; }
  dt { font-weight: 700; margin-top: .6rem; }
  dd { margin: 0 0 .2rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log { font-size: .9rem; }
  .log li { margin: .2rem 0; }
  .foot { margin-top: 2.5rem; font-size: .85rem; color: var(--muted); }
  .foot button { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; cursor: pointer; }
  a { color: var(--blue); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   KONFIGURATION – hier anpassen (Antworten, Teams, Fragen)
   Antworten werden tolerant verglichen: Gross/Klein, Umlaute, Leerzeichen
   und 1–2 Tippfehler sind egal. Zahlen müssen exakt stimmen.
   ========================================================================= */
const CONFIG = {
  // Code, den die Spielleitung in JEDES Antwortfeld tippen kann, um einen Schritt zu überspringen:
  spielleiterCode: "luzern2026",

  // WhatsApp-Nummer der Spielleitung für Fotos, ohne + und ohne Leerzeichen, z.B. "41791234567".
  // Leer lassen, wenn ihr die Nummer lieber nur im Umschlag habt.
  whatsappNummer: "",

  punkte: { ziel: 10, zahl: 10, triviaProFrage: 5, foto: 10, hinweisStrafe: 10 },

  teams: {
    "hefe": {
      anzeige: "Team Hefe",
      code: "123456",
      stationen: ["loewendenkmal", "wasserturm"]   // Reihenfolge für dieses Team
    }
  },

  stationen: {
    loewendenkmal: {
      name: "Löwendenkmal",
      kurz: "Löwe",
      zielAntworten: ["Löwendenkmal", "Loewendenkmal", "Löwen Denkmal", "Lion Monument", "Löwenplatz", "Lion of Lucerne"],

      zahl: {
        frage: "Die Inschrift nennt vier Zahlen in römischen Ziffern: gefallene Offiziere, gefallene Soldaten, überlebende Offiziere, überlebende Soldaten. Findet alle vier, rechnet sie um und gebt die Summe ein.",
        antwort: "1152"   // 26 + 760 + 16 + 350 – morgen vor Ort prüfen!
      },

      trivia: {
        intro: "Die Antworten stehen auf den Infotafeln vor Ort. Googeln gilt nicht, Ehrensache.",
        fragen: [
          { frage: "Die Schweizergardisten starben beim Schutz eines französischen Königs. Welcher war es?",
            antworten: ["Ludwig XVI", "Ludwig 16", "Louis XVI", "Louis 16", "Ludwig der Sechzehnte"] },
          { frage: "Der Löwe wurde von einem dänischen Bildhauer entworfen. Wie heisst er mit Nachnamen?",
            antworten: ["Thorvaldsen", "Thorwaldsen", "Bertel Thorvaldsen"] },
          { frage: "Entworfen in Rom, gemeisselt in Luzern: Wer hat den Löwen tatsächlich in den Fels gehauen?",
            antworten: ["Ahorn", "Lukas Ahorn", "Lucas Ahorn"] }
        ]
      },

      foto: {
        text: "Ein Foto mit dem ganzen Team und dem Löwen im Bild, aber ohne eine einzige fremde Person. Braucht Timing, einen guten Winkel und ein freundliches «Momänt bitte».",
        whatsappText: "Team Hefe: Foto Löwendenkmal"
      },

      // Rätsel zur nächsten Station (wird nach dem Lösen aller Aufgaben gezeigt)
      raetsel: {
        stufe1: "Acht Ecken, älter als mein berühmter Nachbar. Ich habe Gold, Akten und Gefangene beherbergt.",
        stufe2: "Mein Nachbar brannte 1993 und verlor die meisten seiner Bilder."
      }
    },

    wasserturm: {
      name: "Wasserturm",
      kurz: "Wasserturm",
      zielAntworten: ["Wasserturm", "Kapellbrücke", "Kapellbruecke", "Kapellbrücke Wasserturm", "Chapel Bridge", "Water Tower"],
      demoEnde: true   // Testversion: hier ist Schluss
    }
  }
};

/* ========================= Spiel-Logik ========================= */
const app = document.getElementById("app");
let team = null;    // Schlüssel in CONFIG.teams
let st = null;      // Spielstand

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function fetchStore(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() { store("sj_" + team, st); store("sj_current", team); }

function freshState() {
  return { idx: 0, phase: "ziel", tasks: {}, punkte: 0, strafen: 0, log: [], start: Date.now() };
}
function logEv(text) { st.log.push({ t: Date.now(), text }); save(); }
function fmt(t) { return new Date(t).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); }
function station() { return CONFIG.stationen[CONFIG.teams[team].stationen[st.idx]]; }
function stationId() { return CONFIG.teams[team].stationen[st.idx]; }
function taskState() {
  const id = stationId();
  if (!st.tasks[id]) st.tasks[id] = { zahl: false, trivia: [], triviaIdx: 0, foto: false, hinweis: false, versuche: 0 };
  return st.tasks[id];
}

function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss").replace(/[^a-z0-9]/g, "");
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function isSkip(input) { return norm(input) === norm(CONFIG.spielleiterCode); }
function matchText(input, answers) {
  const n = norm(input); if (!n) return false;
  return answers.some(a => {
    const m = norm(a); if (n === m) return true;
    const tol = m.length >= 10 ? 2 : (m.length >= 6 ? 1 : 0);   // Tippfehler-Toleranz
    return lev(n, m) <= tol;
  });
}
function matchNumber(input, answer) {
  const d = String(input).replace(/[^0-9]/g, "");
  return d.length > 0 && d === String(answer).replace(/[^0-9]/g, "");
}

/* ========================= Rendering ========================= */
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render() {
  app.innerHTML = "";
  if (!team) return renderLogin();
  if (st.phase === "ende") return renderEnde();
  app.appendChild(topbar());
  app.appendChild(lineStrip());
  if (st.phase === "ziel") renderZiel();
  else renderAufgaben();
  app.appendChild(el(`<div class="foot">Spielleitung erreicht ihr per WhatsApp. <button type="button" id="reset">Neu starten (nur zum Testen)</button></div>`));
  document.getElementById("reset").onclick = () => {
    if (confirm("Wirklich alles zurücksetzen? Der Spielstand dieses Teams geht verloren.")) {
      st = freshState(); save(); team = null; store("sj_current", null); render();
    }
  };
}

function topbar() {
  const t = CONFIG.teams[team];
  const total = st.punkte - st.strafen;
  return el(`<div class="topbar"><strong>${esc(t.anzeige)}</strong><span class="score">${total} Punkte${st.strafen ? ` <span class="muted small">(−${st.strafen})</span>` : ""}</span></div>`);
}

function lineStrip() {
  const ids = CONFIG.teams[team].stationen;
  const stops = ids.map((id, i) => {
    const cls = i < st.idx ? "done" : (i === st.idx ? "now" : "");
    const name = CONFIG.stationen[id].kurz || CONFIG.stationen[id].name;
    const label = (i === st.idx && st.phase === "ziel") ? "?" : name;
    return `<div class="stop ${cls}"><div class="dot"></div><div class="label">${esc(label)}</div></div>`;
  }).join("");
  return el(`<div class="line"><div class="track"></div><div class="stops">${stops}</div></div>`);
}

function renderLogin() {
  const v = el(`
    <div>
      <h1>Schnitzeljagd Luzern</h1>
      <p class="muted">Teamname und Code stehen in eurem Umschlag.</p>
      <div class="block active">
        <div id="loginMsg"></div>
        <label for="tn">Teamname</label>
        <input type="text" id="tn" autocomplete="off" autocapitalize="none">
        <label for="tc">Code</label>
        <input type="tel" id="tc" autocomplete="off">
        <button class="btn" id="go">Los geht’s</button>
      </div>
    </div>`);
  app.appendChild(v);
  const go = () => {
    const name = norm(document.getElementById("tn").value);
    const code = document.getElementById("tc").value.trim();
    const hit = Object.keys(CONFIG.teams).find(k => norm(k) === name && CONFIG.teams[k].code === code);
    if (!hit) {
      document.getElementById("loginMsg").innerHTML = `<div class="msg err">Teamname oder Code stimmt nicht. Schaut nochmals in den Umschlag.</div>`;
      return;
    }
    team = hit;
    st = fetchStore("sj_" + team) || freshState();
    if (!st.log.length) logEv("Eingeloggt");
    save(); render();
  };
  document.getElementById("go").onclick = go;
  v.querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
}

function renderZiel() {
  const s = station();
  const n = st.idx + 1;
  const prev = st.idx > 0 ? CONFIG.stationen[CONFIG.teams[team].stationen[st.idx - 1]] : null;
  const ts = taskState();
  let raetselHtml = "";
  if (prev && prev.raetsel) {
    raetselHtml = `
      <div class="block">
        <h3>Das Rätsel</h3>
        <div class="riddle">${esc(prev.raetsel.stufe1)}</div>
        ${ts.hinweis
          ? `<div class="riddle hint">${esc(prev.raetsel.stufe2)}</div>`
          : `<button class="btn quiet" id="hint">Hinweis anzeigen (−${CONFIG.punkte.hinweisStrafe} Punkte)</button>`}
      </div>`;
  } else {
    raetselHtml = `<p class="muted">Das Rätsel zu dieser Station liegt im Umschlag.</p>`;
  }
  const v = el(`
    <div>
      <h2>Station ${n}: Wohin geht’s?</h2>
      ${raetselHtml}
      <div class="block active">
        <div id="zielMsg"></div>
        <label for="ziel">Euer Ziel</label>
        <input type="text" id="ziel" autocomplete="off" placeholder="Name des Ortes">
        <button class="btn" id="zielGo">Prüfen</button>
      </div>
    </div>`);
  app.appendChild(v);
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { ts.hinweis = true; st.strafen += CONFIG.punkte.hinweisStrafe; logEv("Hinweis geöffnet: " + s.name); render(); };
  const go = () => {
    const val = document.getElementById("ziel").value;
    if (isSkip(val) || matchText(val, s.zielAntworten)) {
      st.punkte += CONFIG.punkte.ziel;
      logEv((isSkip(val) ? "Spielleitung: " : "") + "Ziel erkannt: " + s.name);
      st.phase = s.demoEnde ? "ende" : "aufgaben";
      save(); render();
    } else {
      ts.versuche++; save();
      const box = document.getElementById("zielMsg");
      box.innerHTML = `<div class="msg err">Das ist es nicht. Nochmals lesen, nochmals probieren.</div>`;
      box.parentElement.classList.remove("shake"); void box.offsetWidth; box.parentElement.classList.add("shake");
    }
  };
  document.getElementById("zielGo").onclick = go;
  document.getElementById("ziel").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  document.getElementById("ziel").focus();
}

function renderAufgaben() {
  const s = station();
  const ts = taskState();
  const P = CONFIG.punkte;
  const triviaDone = ts.trivia.length === s.trivia.fragen.length && ts.trivia.every(Boolean);
  const allDone = ts.zahl && triviaDone && ts.foto;
  const stampHtml = (t) => `<div class="stamp ${t === justStamped ? "fresh" : ""}">Erledigt ${fmt(t)}</div>`;

  const v = el(`<div><h2>${esc(s.name)}</h2><p class="muted">Ihr seid da. Drei Aufgaben, die Reihenfolge ist euch überlassen: das Foto geht parallel.</p></div>`);
  app.appendChild(v);

  /* 1 – Römische Zahlen */
  const b1 = el(`
    <div class="block ${ts.zahl ? "done" : "active"}">
      ${ts.zahl ? stampHtml(ts.zahlT) : ""}
      <h3>Römische Zahlen</h3>
      <p>${esc(s.zahl.frage)}</p>
      ${ts.zahl ? "" : `<div id="zahlMsg"></div><input type="tel" id="zahl" autocomplete="off" placeholder="Summe"><button class="btn" id="zahlGo">Prüfen</button>`}
    </div>`);
  app.appendChild(b1);
  if (!ts.zahl) {
    const go = () => {
      const val = document.getElementById("zahl").value;
      if (isSkip(val) || matchNumber(val, s.zahl.antwort)) {
        ts.zahl = true; ts.zahlT = Date.now(); justStamped = ts.zahlT;
        st.punkte += P.zahl; logEv((isSkip(val) ? "Spielleitung: " : "") + "Römische Zahlen gelöst"); render();
      } else {
        ts.versuche++; save();
        document.getElementById("zahlMsg").innerHTML = `<div class="msg err">Stimmt nicht. Habt ihr alle vier Zahlen? Und die Umrechnung geprüft?</div>`;
        b1.classList.remove("shake"); void b1.offsetWidth; b1.classList.add("shake");
      }
    };
    document.getElementById("zahlGo").onclick = go;
    document.getElementById("zahl").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }

  /* 2 – Foto */
  const wa = CONFIG.whatsappNummer
    ? `<a class="btn ghost" style="text-align:center;margin-bottom:.6rem" href="https://wa.me/${CONFIG.whatsappNummer}?text=${encodeURIComponent(s.foto.whatsappText)}" target="_blank" rel="noopener">Foto per WhatsApp an die Spielleitung</a>`
    : `<p class="small muted">Schickt das Foto per WhatsApp an die Spielleitung (Nummer im Umschlag).</p>`;
  const b2 = el(`
    <div class="block ${ts.foto ? "done" : "active"}">
      ${ts.foto ? stampHtml(ts.fotoT) : ""}
      <h3>Teamfoto</h3>
      <p>${esc(s.foto.text)}</p>
      ${ts.foto ? "" : wa + `
        <label class="check"><input type="checkbox" id="fotoChk"> Foto ist gemacht und an die Spielleitung geschickt</label>`}
    </div>`);
  app.appendChild(b2);
  if (!ts.foto) {
    document.getElementById("fotoChk").onchange = (e) => {
      if (!e.target.checked) return;
      ts.foto = true; ts.fotoT = Date.now(); justStamped = ts.fotoT;
      st.punkte += P.foto; logEv("Teamfoto gemeldet"); render();
    };
  }

  /* 3 – Trivia */
  if (!ts.zahl) {
    app.appendChild(el(`<div class="block locked"><h3>Trivia</h3><p>Wird freigeschaltet, sobald die Summe stimmt.</p></div>`));
  } else {
    const q = s.trivia.fragen;
    const i = ts.triviaIdx;
    const doneList = q.slice(0, ts.trivia.length).map((f, k) => `<dt>${esc(f.frage)}</dt><dd>Gelöst ${fmt(ts.triviaT[k])}</dd>`).join("");
    const b3 = el(`
      <div class="block ${triviaDone ? "done" : "active"}">
        ${triviaDone ? stampHtml(ts.triviaT[q.length - 1]) : ""}
        <h3>Trivia ${triviaDone ? "" : `${i + 1} von ${q.length}`}</h3>
        ${triviaDone ? "" : `<p class="muted small">${esc(s.trivia.intro)}</p>`}
        ${doneList ? `<dl>${doneList}</dl>` : ""}
        ${triviaDone ? "" : `
          <p style="margin-top:.8rem"><strong>${esc(q[i].frage)}</strong></p>
          <div id="trMsg"></div>
          <input type="text" id="tr" autocomplete="off" placeholder="Antwort">
          <button class="btn" id="trGo">Prüfen</button>`}
      </div>`);
    app.appendChild(b3);
    if (!triviaDone) {
      const go = () => {
        const val = document.getElementById("tr").value;
        if (isSkip(val) || matchText(val, q[i].antworten)) {
          ts.trivia[i] = true; ts.triviaT = ts.triviaT || []; ts.triviaT[i] = Date.now(); justStamped = ts.triviaT[i];
          ts.triviaIdx = i + 1; st.punkte += P.triviaProFrage;
          logEv((isSkip(val) ? "Spielleitung: " : "") + `Trivia ${i + 1} gelöst`); render();
        } else {
          ts.versuche++; save();
          document.getElementById("trMsg").innerHTML = `<div class="msg err">Nein. Die Tafel nochmals genau lesen.</div>`;
          b3.classList.remove("shake"); void b3.offsetWidth; b3.classList.add("shake");
        }
      };
      document.getElementById("trGo").onclick = go;
      document.getElementById("tr").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
  }

  /* Weiter */
  if (allDone) {
    const b4 = el(`
      <div class="block active">
        <h3>Alles erledigt</h3>
        <p>Das Rätsel zur nächsten Station wartet.</p>
        <button class="btn" id="next">Rätsel anzeigen</button>
      </div>`);
    app.appendChild(b4);
    document.getElementById("next").onclick = () => {
      logEv("Station abgeschlossen: " + s.name);
      st.idx++; st.phase = "ziel"; save(); render();
    };
  }
  justStamped = null;
}
let justStamped = null;

function renderEnde() {
  const t = CONFIG.teams[team];
  const total = st.punkte - st.strafen;
  const mins = Math.round((Date.now() - st.start) / 60000);
  const rows = st.log.map(e => `<li>${fmt(e.t)} – ${esc(e.text)}</li>`).join("");
  const v = el(`
    <div>
      <h1>Ende der Testversion</h1>
      <p class="muted">Ab hier kämen die Aufgaben der nächsten Station.</p>
      <div class="block done">
        <h3>${esc(t.anzeige)}</h3>
        <dl>
          <dt>Punkte</dt><dd>${total} (davon ${st.strafen} Strafpunkte)</dd>
          <dt>Spielzeit</dt><dd>${mins} Minuten</dd>
        </dl>
      </div>
      <div class="block">
        <h3>Protokoll</h3>
        <p class="small muted">Zeigt diesen Bildschirm am Schluss der Spielleitung.</p>
        <ul class="log">${rows}</ul>
      </div>
      <button class="btn quiet" id="reset2">Neu starten (nur zum Testen)</button>
    </div>`);
  app.appendChild(v);
  document.getElementById("reset2").onclick = () => { st = freshState(); save(); team = null; store("sj_current", null); render(); };
}

/* Start: angemeldetes Team wiederherstellen */
(function init() {
  const cur = fetchStore("sj_current");
  if (cur && CONFIG.teams[cur]) { team = cur; st = fetchStore("sj_" + team) || freshState(); }
  render();
})();
</script>
