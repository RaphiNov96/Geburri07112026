const app = document.getElementById("app");
let team = null, st = null, db = null, teamRef = null, online = false, adminOk = false, adminData = {}, adminBound = false, justStamped = null;

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function fetchStore(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
/* Eingeloggtes Team nur für die Browser-Sitzung merken: Browser zu = neu einloggen, Spielstand bleibt. */
function sessionSet(v) { try { if (v) sessionStorage.setItem("sj_current", v); else sessionStorage.removeItem("sj_current"); } catch (e) {} }

}
function freshState() { return { rev: 0, idx: 0, phase: "ziel", tasks: {}, punkte: 0, strafen: 0, log: [], start: Date.now(), lastSeen: Date.now(), finalHints: 0 }; }
function normalize(s) {
  s = s || freshState();
  s.tasks = s.tasks || {}; s.log = s.log || []; s.rev = s.rev || 0; s.finalHints = s.finalHints || 0;
  Object.values(s.tasks).forEach(t => { t.done = t.done || {}; t.doneT = t.doneT || {}; t.triviaIdx = t.triviaIdx || {}; t.triviaT = t.triviaT || {}; t.bonus = t.bonus || {}; t.hint = t.hint || {}; });
  return s;
}

  st.rev = (st.rev || 0) + 1; st.lastSeen = Date.now();

  if (teamRef) teamRef.set(JSON.parse(JSON.stringify(st)));

function logEv(text, kind) { st.log.push({ t: Date.now(), text, kind: kind || "" }); save(); }
function fmt(t) { return new Date(t).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); }
function ago(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "gerade eben" : `vor ${m} Min.`; }

async function loginTeam(k) {
  team = k;
  if (db) {
    teamRef = db.ref("teams/" + k);
    const snap = await teamRef.once("value");
    st = normalize(snap.exists() ? snap.val() : null);
    logEv(snap.exists() ? "Weiteres Handy eingeloggt" : "Eingeloggt");
    teamRef.on("value", s => {
      if (!s.exists()) { st = freshState(); render(); return; }
      const inc = normalize(s.val());
      if (inc.rev !== st.rev) { st = inc; store("sj_" + team, st); render(); }
    });
  } else {
    st = normalize(fetchStore("sj_" + k));
    if (!st.log.length) logEv("Eingeloggt"); else save();
  }
  render();
}
function logout() { if (teamRef) teamRef.off(); teamRef = null; team = null; st = null; sessionSet(null); render(); }

/* ========================= Hilfsfunktionen ========================= */
function stationIds() { return CONFIG.teams[team].stationen; }
function stationId() { return stationIds()[st.idx]; }
function station() { return CONFIG.stationen[stationId()]; }
function taskState(id) {
  id = id || stationId();
  if (!st.tasks[id]) st.tasks[id] = { done: {}, doneT: {}, triviaIdx: {}, triviaT: {}, bonus: {}, hint: {}, hinweis: false, versuche: 0 };
  return st.tasks[id];
}
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss").replace(/[^a-z0-9]/g, ""); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function isSkip(input) { return norm(input) === norm(CONFIG.spielleiterCode); }
function matchText(input, answers) {
  const n = norm(input); if (!n) return false;
  return answers.some(a => { const m = norm(a); if (n === m) return true; const tol = m.length >= 10 ? 2 : (m.length >= 6 ? 1 : 0); return lev(n, m) <= tol; });
}
function matchNumber(input, answer) { const d = String(input).replace(/[^0-9]/g, ""); return d.length > 0 && d === String(answer).replace(/[^0-9]/g, ""); }
function matchCoords(input) {
  const F = CONFIG.final;
  if (matchText(input, F.nameAntworten)) return true;
  let s = String(input).replace(/(\d)[’'](?=\d)/g, "$1");
  let toks = s.match(/\d+/g) || [];
  let big = toks.filter(t => t.length >= 6);
  if (big.length < 2) { const all = toks.join(""); if (all.length === 14 || all.length === 12) big = [all.slice(0, all.length / 2), all.slice(all.length / 2)]; }
  let e = null, n = null;
  big.map(Number).forEach(v => {
    if (v >= 2000000 && v < 3000000) e = v; else if (v >= 1000000 && v < 2000000) n = v;
    else if (v >= 400000 && v < 900000) e = v + 2000000; else if (v >= 50000 && v < 400000) n = v + 1000000;
  });
  return e !== null && n !== null && Math.abs(e - F.e) <= F.toleranz && Math.abs(n - F.n) <= F.toleranz;
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function wrong(label, val, box, block, text) {
  if (st.phase !== "final") taskState().versuche++;
  logEv(`Falsch (${label}): «${String(val).trim().slice(0, 40)}»`, "bad");
  box.innerHTML = `<div class="msg err">${text}</div>`;
  block.classList.remove("shake"); void block.offsetWidth; block.classList.add("shake");
}
function taskDone(a, ts) { return a.typ === "trivia" ? (ts.triviaIdx[a.id] || 0) >= a.fragen.length : !!ts.done[a.id]; }
function stationDone(s, ts) { return s.aufgaben.every(a => taskDone(a, ts)); }

/* ========================= Spielfluss ========================= */
function advance(byGm) {
  const P = CONFIG.punkte, pre = byGm ? "Spielleitung: " : "", kind = byGm ? "gm" : "";
  if (st.phase === "ziel") {
    const s = station(); st.punkte += P.ziel; logEv(pre + "Ziel erkannt: " + s.name, kind); st.phase = "aufgaben"; save(); return;
  }
  if (st.phase === "aufgaben") {
    const s = station(), ts = taskState();
    const open = s.aufgaben.find(a => !taskDone(a, ts));
    if (open) { completeTask(open, byGm); return; }
    logEv(pre + "Station abgeschlossen: " + s.name, kind);
    st.idx++; st.phase = st.idx >= stationIds().length ? "final" : "ziel"; save(); return;
  }
  if (st.phase === "final") { st.punkte += P.final; logEv(pre + "Bar gefunden", kind); st.phase = "ende"; st.ende = Date.now(); save(); }
}

function completeTask(a, byGm) {
  const ts = taskState(), pre = byGm ? "Spielleitung: " : "", kind = byGm ? "gm" : "";
  if (a.typ === "trivia") { const i = ts.triviaIdx[a.id] || 0; ts.triviaIdx[a.id] = i + 1; ts.triviaT[a.id] = ts.triviaT[a.id] || {}; ts.triviaT[a.id][i] = Date.now(); st.punkte += a.punkteProFrage; logEv(pre + `Trivia ${i + 1} gelöst`, kind); justStamped = ts.triviaT[a.id][i]; }
  else { ts.done[a.id] = true; ts.doneT[a.id] = Date.now(); st.punkte += a.punkte; logEv(pre + a.titel + " erledigt", kind); justStamped = ts.doneT[a.id]; }
  save();
}

/* ========================= Rendering ========================= */
function render() {
  if (location.hash === "#admin") return renderAdmin();
  app.className = "wrap"; app.innerHTML = "";
  if (!team) return renderLogin();
  if (st.phase === "ende") return renderEnde();
  app.appendChild(topbar()); app.appendChild(lineStrip());
  if (st.phase === "ziel") renderZiel(); else if (st.phase === "final") renderFinal(); else renderAufgaben();
  app.appendChild(el(`<div class="foot"><span class="conn${online ? " on" : ""}" id="conn"></span>${db ? "Spielstand wird für das ganze Team gespeichert." : "Spielstand ist nur auf diesem Handy gespeichert."} <button type="button" id="logout">Anderes Team</button></div>`));
  document.getElementById("logout").onclick = logout;
}
function topbar() {
  const t = CONFIG.teams[team], total = st.punkte - st.strafen;
  return el(`<div class="topbar"><strong>${esc(t.anzeige)}</strong><span class="score">${total} Punkte${st.strafen ? ` <span class="muted small">(−${st.strafen})</span>` : ""}</span></div>`);
}
function lineStrip() {
  const ids = stationIds();
  let stops = ids.map((id, i) => {
    const cls = i < st.idx ? "done" : (i === st.idx && st.phase !== "final" ? "now" : "");
    return `<div class="stop ${cls}"><div class="dot"></div><div class="label">Station ${i + 1}</div></div>`;
  }).join("");
  stops += `<div class="stop bar ${st.phase === "final" ? "now" : (st.phase === "ende" ? "done" : "")}"><div class="dot"></div><div class="label">${st.phase === "ende" ? "Bar" : "?"}</div></div>`;
  return el(`<div class="line"><div class="track"></div><div class="stops">${stops}</div></div>`);
}
function renderLogin() {
  const v = el(`
    <div><h1>Schnitzeljagd Luzern</h1><p class="muted">Teamname und Code stehen in eurem Umschlag.</p>
      <div class="block active"><div id="loginMsg"></div>
        <label for="tn">Teamname</label><input type="text" id="tn" autocomplete="off" autocapitalize="none">
        <label for="tc">Code</label><input type="text" id="tc" autocomplete="off" autocapitalize="none">
        <button class="btn" id="go">Los geht’s</button></div></div>`);
  app.appendChild(v);
  const go = () => {
    const name = norm(document.getElementById("tn").value), code = norm(document.getElementById("tc").value);
    const hit = Object.keys(CONFIG.teams).find(k => norm(k) === name && norm(CONFIG.teams[k].code) === code);
    if (!hit) { document.getElementById("loginMsg").innerHTML = `<div class="msg err">Teamname oder Code stimmt nicht. Schaut nochmals in den Umschlag.</div>`; return; }
    document.getElementById("go").textContent = "Lade Spielstand …"; loginTeam(hit);
  };
  document.getElementById("go").onclick = go;
  v.querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
}
function renderZiel() {
  const s = station(), n = st.idx + 1, ts = taskState();
  const prev = st.idx > 0 ? CONFIG.stationen[stationIds()[st.idx - 1]] : null;
  let raetselHtml;
  if (prev && prev.naechstesRaetselPerWhatsapp) {
    raetselHtml = `<div class="block warn"><h3>Das Rätsel</h3><p>Das Rätsel zur nächsten Station schickt euch die Spielleitung per WhatsApp, sobald euer Foto angekommen ist. Wenn ihr es gelöst habt: Ziel hier eingeben.</p></div>`;
  } else if (st.idx === 0 && !CONFIG.ersteRaetselAufSeite) {
    raetselHtml = `<p class="muted">Das Rätsel zu dieser Station liegt im Umschlag.</p>`;
  } else {
    raetselHtml = `<div class="block"><h3>Das Rätsel</h3><div class="riddle">${esc(s.raetsel.stufe1)}</div>
      ${ts.hinweis ? `<div class="riddle hint">${esc(s.raetsel.stufe2)}</div>` : `<button class="btn quiet" id="hint">Hinweis anzeigen (−${CONFIG.punkte.hinweisStrafe} Punkte)</button>`}</div>`;
  }
  app.appendChild(el(`<div><h2>Station ${n}: Wohin geht’s?</h2>${raetselHtml}
    <div class="block active" id="zielBlock"><div id="zielMsg"></div>
      <label for="ziel">Euer Ziel</label><input type="text" id="ziel" autocomplete="off" placeholder="Name des Ortes">
      <button class="btn" id="zielGo">Prüfen</button></div></div>`));
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { ts.hinweis = true; st.strafen += CONFIG.punkte.hinweisStrafe; logEv("Hinweis geöffnet (Station " + n + ")"); render(); };
  const go = () => {
    const val = document.getElementById("ziel").value;
    if (isSkip(val) || matchText(val, s.zielAntworten)) { advance(isSkip(val)); render(); }
    else wrong("Ziel " + n, val, document.getElementById("zielMsg"), document.getElementById("zielBlock"), "Das ist es nicht. Nochmals lesen, nochmals probieren.");
  };
  document.getElementById("zielGo").onclick = go;
  document.getElementById("ziel").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
function waLink(a) {
  const txt = `${CONFIG.teams[team].anzeige}: ${a.whatsappText || a.titel}`;
  return CONFIG.whatsappNummer
    ? `<a class="btn ghost" style="margin-bottom:.6rem" href="https://wa.me/${CONFIG.whatsappNummer}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Foto per WhatsApp an die Spielleitung</a>`
    : `<p class="small muted">Schickt das Foto per WhatsApp an die Spielleitung (Nummer im Umschlag).</p>`;
}
function renderAufgaben() {
  const s = station(), ts = taskState();
  const stampHtml = (t) => `<div class="stamp ${t === justStamped ? "fresh" : ""}">Erledigt ${fmt(t)}</div>`;
  app.appendChild(el(`<div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.intro || "Ihr seid da.")}</p></div>`));

  s.aufgaben.forEach(a => {
    const done = taskDone(a, ts);
    const locked = a.nach && !taskDone(s.aufgaben.find(x => x.id === a.nach), ts);
    if (locked) { app.appendChild(el(`<div class="block locked"><h3>${esc(a.titel)}</h3><p>Wird freigeschaltet, sobald «${esc(s.aufgaben.find(x => x.id === a.nach).titel)}» gelöst ist.</p></div>`)); return; }

    if (a.typ === "zahl" || a.typ === "text") {
      const b = el(`<div class="block ${done ? "done" : "active"}">${done ? stampHtml(ts.doneT[a.id]) : ""}<h3>${esc(a.titel)}</h3><p style="white-space:pre-line">${esc(a.text)}</p>
        ${done ? "" : `${a.hinweis ? (ts.hint[a.id] ? `<div class="riddle hint" style="font-size:1rem">${esc(a.hinweis)}</div>` : `<button class="btn quiet" id="h_${a.id}" style="margin-bottom:.6rem">Hinweis anzeigen (−${CONFIG.punkte.hinweisStrafe} Punkte)</button>`) : ""}
        <div id="m_${a.id}"></div><input type="${a.typ === "zahl" ? "tel" : "text"}" id="i_${a.id}" autocomplete="off" placeholder="${a.typ === "zahl" ? "Zahl" : "Antwort"}"><button class="btn" id="g_${a.id}">Prüfen</button>`}</div>`);
      app.appendChild(b);
      if (!done) {
        const h = document.getElementById("h_" + a.id);
        if (h) h.onclick = () => { ts.hint[a.id] = true; st.strafen += CONFIG.punkte.hinweisStrafe; logEv("Hinweis geöffnet: " + a.titel); render(); };
        const go = () => { const val = document.getElementById("i_" + a.id).value;
          const ok = a.typ === "zahl" ? matchNumber(val, a.antwort) : matchText(val, a.antworten);
          if (isSkip(val) || ok) { completeTask(a, isSkip(val)); render(); }
          else wrong(a.titel, val, document.getElementById("m_" + a.id), b, a.typ === "zahl" ? "Stimmt nicht. Nochmals zählen, nochmals rechnen." : "Nein. Nochmals genau hinschauen."); };
        document.getElementById("g_" + a.id).onclick = go;
        document.getElementById("i_" + a.id).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      }
    }

    if (a.typ === "foto") {
      const b = el(`<div class="block ${done ? "done" : "active"}">${done ? stampHtml(ts.doneT[a.id]) : ""}<h3>${esc(a.titel)}</h3><p>${esc(a.text)}</p>
        ${done ? (ts.bonus[a.id] ? `<p class="small" style="color:var(--ok);font-weight:700">Bonus eingelöst</p>` : "") : waLink(a) +
          (a.bonus ? `<label class="check"><input type="checkbox" id="b_${a.id}" ${ts.bonus[a.id] ? "checked" : ""}> ${esc(a.bonus.text)}</label>` : "") +
          `<label class="check"><input type="checkbox" id="c_${a.id}"> Foto ist gemacht und an die Spielleitung geschickt</label>`}</div>`);
      app.appendChild(b);
      if (!done) {
        const bx = document.getElementById("b_" + a.id);
        if (bx) bx.onchange = (e) => { ts.bonus[a.id] = e.target.checked; save(); };
        document.getElementById("c_" + a.id).onchange = (e) => { if (!e.target.checked) return;
          if (ts.bonus[a.id]) { st.punkte += a.bonus.punkte; logEv("Bonus: " + a.bonus.text); }
          completeTask(a, false); render(); };
      }
    }

    if (a.typ === "trivia") {
      const i = ts.triviaIdx[a.id] || 0, T = ts.triviaT[a.id] || {};
      const doneList = a.fragen.slice(0, i).map((f, k) => `<dt>${esc(f.frage)}</dt><dd>Gelöst ${fmt(T[k])}</dd>`).join("");
      const b = el(`<div class="block ${done ? "done" : "active"}">${done ? stampHtml(T[a.fragen.length - 1]) : ""}
        <h3>${esc(a.titel)}${done ? "" : ` ${i + 1} von ${a.fragen.length}`}</h3>${done ? "" : `<p class="muted small">${esc(a.intro)}</p>`}
        ${doneList ? `<dl>${doneList}</dl>` : ""}
        ${done ? "" : `<p style="margin-top:.8rem"><strong>${esc(a.fragen[i].frage)}</strong></p><div id="m_${a.id}"></div>
          <input type="text" id="i_${a.id}" autocomplete="off" placeholder="Antwort"><button class="btn" id="g_${a.id}">Prüfen</button>`}</div>`);
      app.appendChild(b);
      if (!done) {
        const go = () => { const val = document.getElementById("i_" + a.id).value;
          if (isSkip(val) || matchText(val, a.fragen[i].antworten)) { completeTask(a, isSkip(val)); render(); }
          else wrong(`Trivia ${i + 1}`, val, document.getElementById("m_" + a.id), b, "Nein. Die Tafel nochmals genau lesen."); };
        document.getElementById("g_" + a.id).onclick = go;
        document.getElementById("i_" + a.id).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      }
    }
  });

  if (stationDone(s, ts)) {
    const last = st.idx === stationIds().length - 1;
    app.appendChild(el(`<div class="block active"><h3>Alles erledigt</h3><p>${last ? "Jetzt fehlt nur noch die Bar." : "Das Rätsel zur nächsten Station wartet."}</p><button class="btn" id="next">${last ? "Zur letzten Station" : "Weiter"}</button></div>`));
    document.getElementById("next").onclick = () => { advance(false); render(); };
  }
  justStamped = null;
}
function renderFinal() {
  const F = CONFIG.final, h = st.finalHints || 0;
  const hints = F.hinweise.slice(0, h).map((x, i) => `<div class="riddle hint"><span class="muted small">Hinweis ${i + 1}</span><br>${esc(x)}</div>`).join("");
  app.appendChild(el(`<div><h2>${esc(F.titel)}</h2>
    <div class="block"><div class="riddle long">${esc(F.text)}</div>${hints}
      ${h < F.hinweise.length ? `<button class="btn quiet" id="fh">Hinweis ${h + 1} von ${F.hinweise.length} anzeigen (−${CONFIG.punkte.hinweisStrafe} Punkte)</button>` : ""}</div>
    <div class="block active" id="fBlock"><div id="fMsg"></div><label for="fin">Koordinaten (Ost und Nord)</label>
      <input type="text" id="fin" autocomplete="off" placeholder="Ost und Nord"><button class="btn" id="fGo">Prüfen</button></div></div>`));
  const fh = document.getElementById("fh");
  if (fh) fh.onclick = () => { st.finalHints = h + 1; st.strafen += CONFIG.punkte.hinweisStrafe; logEv(`Final-Hinweis ${h + 1} geöffnet`); render(); };
  const go = () => { const val = document.getElementById("fin").value;
    if (isSkip(val) || matchCoords(val)) { advance(isSkip(val)); render(); }
    else wrong("Koordinaten", val, document.getElementById("fMsg"), document.getElementById("fBlock"), "Das führt euch nirgendwohin. Nochmals rechnen – oder einen Hinweis nehmen."); };
  document.getElementById("fGo").onclick = go;
  document.getElementById("fin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
function renderEnde() {
  const t = CONFIG.teams[team], total = st.punkte - st.strafen, mins = Math.round(((st.ende || Date.now()) - st.start) / 60000);
  app.appendChild(el(`<div><h1>Prost!</h1><p>Ihr habt es. Die letzte Station: <strong>${esc(CONFIG.final.adresse)}</strong>. Wer zuerst dort ist, bekommt die erste Runde.</p>
    <div class="block done"><h3>${esc(t.anzeige)}</h3><dl><dt>Punkte</dt><dd>${total}${st.strafen ? ` (davon ${st.strafen} Strafpunkte)` : ""}</dd><dt>Spielzeit</dt><dd>${mins} Minuten</dd></dl></div>
    <div class="block"><h3>Protokoll</h3><p class="small muted">Zeigt diesen Bildschirm der Spielleitung an der Bar.</p><ul class="log">${logHtml(st.log)}</ul></div>
    <div class="foot"><button type="button" id="logout2">Anderes Team</button></div></div>`));
  document.getElementById("logout2").onclick = logout;
}
function logHtml(log) { return (log || []).map(e => `<li class="${e.kind || ""}">${fmt(e.t)} – ${esc(e.text)}</li>`).join(""); }

/* ========================= Spielleitung: #admin ========================= */
function renderAdmin() {
  app.className = "wrap wide"; app.innerHTML = "";
  if (!adminOk) {
    app.appendChild(el(`<div><h1>Spielleitung</h1><div class="block active"><div id="aMsg"></div><label for="ac">Spielleiter-Code</label>
      <input type="password" id="ac"><button class="btn" id="aGo">Öffnen</button></div></div>`));
    const go = () => { if (norm(document.getElementById("ac").value) === norm(CONFIG.spielleiterCode)) { adminOk = true; bindAdmin(); }
      else document.getElementById("aMsg").innerHTML = `<div class="msg err">Code stimmt nicht.</div>`; };
    document.getElementById("aGo").onclick = go;
    document.getElementById("ac").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    return;
  }
  drawAdmin();
}
function bindAdmin() {
  if (db) { if (!adminBound) { adminBound = true; db.ref("teams").on("value", s => { adminData = s.val() || {}; drawAdmin(); }); } else drawAdmin(); }
  else { adminData = {}; Object.keys(CONFIG.teams).forEach(k => { const v = fetchStore("sj_" + k); if (v) adminData[k] = v; }); drawAdmin(); }
}
function drawAdmin() {
  if (location.hash !== "#admin") return;
  app.className = "wrap wide"; app.innerHTML = "";
  app.appendChild(el(`<div class="topbar"><strong>Spielleitung</strong><span class="small muted">${db ? "Live aus der Datenbank" : "Nur Spielstände dieses Handys (kein Firebase)"}</span></div>`));
  const grid = el(`<div class="teamgrid"></div>`);
  Object.keys(CONFIG.teams).forEach(k => {
    const t = CONFIG.teams[k], d = adminData[k] ? normalize(JSON.parse(JSON.stringify(adminData[k]))) : null;
    let status = "Noch nicht eingeloggt", ticks = "", logs = "", btn = "";
    const route = t.stationen.map(id => CONFIG.stationen[id].kurz).join(" → ") + " → Bar";
    if (d) {
      if (d.phase === "ende") status = "Fertig – an der Bar";
      else if (d.phase === "final") status = `Sucht die Bar (Hinweise: ${d.finalHints}/${CONFIG.final.hinweise.length})`;
      else { const s = CONFIG.stationen[t.stationen[d.idx]]; status = d.phase === "ziel" ? `Sucht Station ${d.idx + 1} (${s.name})` : `An Station ${d.idx + 1}: ${s.name}`;
        if (d.phase === "aufgaben") { const ts = d.tasks[t.stationen[d.idx]] || normalize({ tasks: { x: {} } }).tasks.x;
          ticks = s.aufgaben.map(a => a.typ === "trivia" ? `${esc(a.titel)} <b>${ts.triviaIdx[a.id] || 0}/${a.fragen.length}</b>` : `${esc(a.titel)} <b>${ts.done[a.id] ? "✓" : "–"}</b>${a.bonus && ts.bonus[a.id] ? " <b>+Bonus</b>" : ""}`).join(" · "); } }
      const lg = d.log.slice().reverse();
      logs = `<details><summary class="small">Protokoll (${lg.length} Einträge, letzte zuerst)</summary><ul class="log">${logHtml(lg)}</ul></details>`;
      if (d.phase !== "ende") btn = `<button class="btn sm ghost" data-skip="${k}" style="margin-top:.6rem">Nächsten Schritt freischalten</button> `;
      btn += `<button class="btn sm danger" data-reset="${k}" style="margin-top:.6rem">Team zurücksetzen</button>`;
    }
    grid.appendChild(el(`<div class="block ${d ? "active" : "locked"}"><h3>${esc(t.anzeige)} <span class="small muted" style="font-weight:400">· Code ${esc(t.code)}</span></h3>
      <div class="small muted">${esc(route)}</div><div class="status">${esc(status)}</div>${ticks ? `<div class="ticks">${ticks}</div>` : ""}
      ${d ? `<div class="small muted">${d.punkte - d.strafen} Punkte · zuletzt aktiv ${ago(d.lastSeen || d.start)}</div>` : ""}${logs}${btn}</div>`));
  });
  app.appendChild(grid);

  const S = CONFIG.stationen, F = CONFIG.final;
  const rz = Object.keys(S).map(id => `<dt>${esc(S[id].name)} – Rätsel (Ziel: ${esc(S[id].zielAntworten[0])})</dt><dd class="sol">${esc(S[id].raetsel.stufe1)}\nHinweis: ${esc(S[id].raetsel.stufe2)}</dd>` +
    S[id].aufgaben.filter(a => a.typ !== "foto").map(a => `<dt>${esc(S[id].name)} – ${esc(a.titel)}</dt><dd class="sol">${a.typ === "trivia" ? a.fragen.map(f => f.antworten[0]).join(" · ") : (a.antwort || a.antworten[0])}</dd>`).join("")).join("");
  app.appendChild(el(`<div class="block" style="margin-top:1rem"><details><summary>Rätsel, Lösungen und Texte zum Verschicken</summary><dl>${rz}
    <dt>Bar – Rätsel</dt><dd class="sol">${esc(F.text)}</dd>
    <dt>Bar – Hinweise</dt><dd class="sol">${F.hinweise.map((h, i) => `${i + 1}. ${esc(h)}`).join("\n")}</dd>
    <dt>Bar – Lösung</dt><dd class="sol">E ${F.e} / N ${F.n} (LV95), Toleranz ±${F.toleranz} m. Gilt auch: «${esc(F.nameAntworten[0])}». ${esc(F.adresse)}</dd></dl></details></div>`));
  app.appendChild(el(`<div class="block warn"><h3>Alles zurücksetzen</h3><p class="small muted">Löscht den Spielstand aller Teams. Nur mit Reset-Code.</p><button class="btn danger" id="resetAll">Alle Teams zurücksetzen</button></div>`));
  app.appendChild(el(`<p class="foot">Zum Spiel zurück: #admin aus der Adresse löschen und neu laden.</p>`));

  grid.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => gmSkip(b.getAttribute("data-skip")));
  grid.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => gmReset(b.getAttribute("data-reset")));
  document.getElementById("resetAll").onclick = () => gmReset(null);
}
async function gmSkip(k) {
  if (!confirm(`${CONFIG.teams[k].anzeige}: nächsten Schritt freischalten?`)) return;
  const sv = [team, st, teamRef]; team = k;
  if (db) { teamRef = db.ref("teams/" + k); const snap = await teamRef.once("value"); st = normalize(snap.exists() ? snap.val() : null); }
  else { st = normalize(fetchStore("sj_" + k)); teamRef = null; }
  advance(true);
  [team, st, teamRef] = sv;
  if (!db) bindAdmin();
}
async function gmReset(k) {
  const code = prompt(k ? `${CONFIG.teams[k].anzeige} zurücksetzen – Reset-Code:` : "ALLE Teams zurücksetzen – Reset-Code:");
  if (code === null) return;
  if (norm(code) !== norm(CONFIG.resetCode)) { alert("Reset-Code stimmt nicht."); return; }
  const keys = k ? [k] : Object.keys(CONFIG.teams);
  for (const key of keys) { try { localStorage.removeItem("sj_" + key); } catch (e) {} }
  sessionSet(null);
  if (db) { if (k) await db.ref("teams/" + k).remove(); else await db.ref("teams").remove(); }
  else bindAdmin();
}

/* ========================= Start ========================= */
window.addEventListener("hashchange", () => { if (location.hash === "#admin") renderAdmin(); else render(); });
(function init() {
  backendInit();
  if (location.hash === "#admin") return renderAdmin();
  const cur = sessionGet();
  if (cur && CONFIG.teams[cur]) loginTeam(cur); else render();
})();
</script>
