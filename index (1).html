<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Schnitzeljagd Luzern</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f5f5f0; --surface: #ffffff; --ink: #16213a; --muted: #5e6675; --line: #d7d9d2;
    --blue: #1f4fa3; --blue-ink: #ffffff; --amber: #d0901f; --stamp: #1f4fa3;
    --err: #b23a2e; --err-bg: #f8e9e6; --ok: #2a7a46; --ok-bg: #e6f3ea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121a2b; --surface: #1a2438; --ink: #eef0f4; --muted: #a2abbd; --line: #2e3a52;
      --blue: #6f9ae8; --blue-ink: #0f1626; --amber: #e2a94a; --stamp: #8fb2f2;
      --err: #f29c92; --err-bg: #3b2320; --ok: #7fcf9a; --ok-bg: #1d3326;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121a2b; --surface: #1a2438; --ink: #eef0f4; --muted: #a2abbd; --line: #2e3a52;
    --blue: #6f9ae8; --blue-ink: #0f1626; --amber: #e2a94a; --stamp: #8fb2f2;
    --err: #f29c92; --err-bg: #3b2320; --ok: #7fcf9a; --ok-bg: #1d3326;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1.1rem 4rem; }
  .wrap.wide { max-width: 44rem; }
  h1 { font-size: 2.1rem; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 .5rem; }
  h2 { font-size: 1.45rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 .4rem; }
  h3 { font-size: 1.05rem; font-weight: 700; margin: 0 0 .3rem; }
  p { margin: 0 0 .8rem; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-bottom: .7rem; border-bottom: 2px solid var(--ink); margin-bottom: 1rem; }
  .topbar strong { font-weight: 800; }
  .score { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .line { position: relative; margin: 1.2rem 0 1.6rem; }
  .line .track { position: absolute; left: 10px; right: 10px; top: 9px; height: 4px; background: var(--line); border-radius: 2px; }
  .line .stops { display: flex; justify-content: space-between; position: relative; }
  .line .stop { display: flex; flex-direction: column; align-items: center; width: 33%; text-align: center; }
  .line .dot { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--line); background: var(--paper); }
  .line .stop.done .dot { background: var(--blue); border-color: var(--blue); }
  .line .stop.now .dot { border-color: var(--blue); background: var(--paper); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--blue); }
  .line .label { font-size: .8rem; margin-top: .45rem; color: var(--muted); line-height: 1.2; }
  .line .stop.now .label { color: var(--ink); font-weight: 700; }

  .block { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 6px; padding: 1rem 1rem 1rem 1.1rem; margin: 0 0 1rem; }
  .block.active { border-left-color: var(--blue); }
  .block.locked { border-left-style: dashed; background: transparent; color: var(--muted); }
  .block.done { border-left-color: var(--stamp); }
  .stamp { position: absolute; top: .6rem; right: .7rem; transform: rotate(-7deg); border: 2px solid var(--stamp); color: var(--stamp); border-radius: 4px; padding: .1rem .45rem; font-size: .72rem; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) {
    .stamp.fresh { animation: stampIn .35s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes stampIn { from { transform: rotate(-7deg) scale(1.8); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  }
  label { display: block; font-weight: 700; margin: 0 0 .3rem; }
  input[type=text], input[type=password], input[type=tel] { width: 100%; font: inherit; font-size: 1.1rem; padding: .7rem .8rem; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); margin-bottom: .6rem; }
  input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
  .btn { display: inline-block; width: 100%; font: inherit; font-weight: 800; font-size: 1.05rem; padding: .8rem 1rem; border-radius: 6px; border: 2px solid var(--blue); background: var(--blue); color: var(--blue-ink); cursor: pointer; text-align: center; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 600; font-size: .95rem; }
  .btn.sm { width: auto; font-size: .9rem; padding: .45rem .7rem; }
  .msg { padding: .6rem .8rem; border-radius: 6px; margin: 0 0 .7rem; font-weight: 600; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .check { display: flex; gap: .7rem; align-items: flex-start; margin: .5rem 0 .8rem; font-weight: 600; }
  .check input { width: 1.4rem; height: 1.4rem; margin: .1rem 0 0; flex: none; accent-color: var(--blue); }
  .riddle { font-size: 1.2rem; line-height: 1.45; font-weight: 600; padding: .2rem 0 .6rem; }
  .riddle.hint { border-top: 1px dashed var(--line); margin-top: .6rem; padding-top: .8rem; font-weight: 500; }
  dl { margin: 0; } dt { font-weight: 700; margin-top: .6rem; } dd { margin: 0 0 .2rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log { font-size: .9rem; padding-left: 1.1rem; } .log li { margin: .2rem 0; }
  .log .bad { color: var(--err); } .log .gm { color: var(--amber); }
  .foot { margin-top: 2.5rem; font-size: .85rem; color: var(--muted); }
  .foot button { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; cursor: pointer; }
  .conn { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--line); margin-right: .3rem; vertical-align: middle; }
  .conn.on { background: var(--ok); }
  a { color: var(--blue); }
  .teamgrid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }
  .status { font-weight: 700; margin: .2rem 0 .5rem; }
  .ticks { font-size: .9rem; color: var(--muted); margin-bottom: .5rem; }
  .ticks b { color: var(--ink); }
</style>
<!-- Firebase (nur aktiv, wenn unten FIREBASE ausgefüllt ist) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   FIREBASE – gemeinsamer Spielstand (optional)
   Werte aus der Firebase-Konsole einfügen: Projekteinstellungen → Meine Apps
   → SDK-Konfiguration. WICHTIG: databaseURL muss dabei sein (steht sonst oben
   auf der Seite «Realtime Database»). Bleibt databaseURL leer, läuft die Seite
   wie bisher nur auf dem einzelnen Handy.
   ========================================================================= */
const FIREBASE = {
  apiKey: "AIzaSyAE42dDRMHchqG-6zCcRQiVzxwgEgdx_M4",
  authDomain: "schnitzeljagd-ccbcd.firebaseapp.com",
  databaseURL: "https://schnitzeljagd-ccbcd-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "schnitzeljagd-ccbcd",
  storageBucket: "schnitzeljagd-ccbcd.firebasestorage.app",
  messagingSenderId: "913099262691",
  appId: "1:913099262691:web:6fd770f7ddd4767aa993d6"
};

/* =========================================================================
   KONFIGURATION – Antworten, Teams, Fragen
   Antworten werden tolerant verglichen: Gross/Klein, Umlaute, Leerzeichen
   und 1–2 Tippfehler sind egal. Zahlen müssen exakt stimmen.
   Spielleitung: Seite mit #admin am Ende der Adresse öffnen.
   ========================================================================= */
const CONFIG = {
  spielleiterCode: "luzern2026",   // in jedes Antwortfeld tippbar → überspringt den Schritt; auch Login für #admin
  whatsappNummer: "",              // z.B. "41791234567" (ohne + und Leerzeichen); leer = nur Hinweistext
  punkte: { ziel: 10, zahl: 10, triviaProFrage: 5, foto: 10, hinweisStrafe: 10 },

  teams: {
    "hefe": { anzeige: "Team Hefe", code: "123456", stationen: ["loewendenkmal", "wasserturm"] }
  },

  stationen: {
    loewendenkmal: {
      name: "Löwendenkmal", kurz: "Löwe",
      zielAntworten: ["Löwendenkmal", "Loewendenkmal", "Löwen Denkmal", "Lion Monument", "Löwenplatz", "Lion of Lucerne"],
      zahl: {
        frage: "Die Inschrift nennt vier Zahlen in römischen Ziffern: gefallene Offiziere, gefallene Soldaten, überlebende Offiziere, überlebende Soldaten. Findet alle vier, rechnet sie um und gebt die Summe ein.",
        antwort: "1152"   // 26 + 760 + 16 + 350 – vor Ort prüfen!
      },
      trivia: {
        intro: "Die Antworten stehen auf den Infotafeln vor Ort. Googeln gilt nicht, Ehrensache.",
        fragen: [
          { frage: "Die Schweizergardisten starben beim Schutz eines französischen Königs. Welcher war es?",
            antworten: ["Ludwig XVI", "Ludwig 16", "Louis XVI", "Louis 16", "Ludwig der Sechzehnte"] },
          { frage: "Der Löwe wurde von einem dänischen Bildhauer entworfen. Wie heisst er mit Nachnamen?",
            antworten: ["Thorvaldsen", "Thorwaldsen", "Bertel Thorvaldsen"] },
          { frage: "Entworfen in Rom, gemeisselt in Luzern: Wer hat den Löwen tatsächlich in den Fels gehauen?",
            antworten: ["Ahorn", "Lukas Ahorn", "Lucas Ahorn"] }
        ]
      },
      foto: {
        text: "Ein Foto mit dem ganzen Team und dem Löwen im Bild, aber ohne eine einzige fremde Person. Braucht Timing, einen guten Winkel und ein freundliches «Momänt bitte».",
        whatsappText: "Team Hefe: Foto Löwendenkmal"
      },
      raetsel: {
        stufe1: "Acht Ecken, älter als mein berühmter Nachbar. Ich habe Gold, Akten und Gefangene beherbergt.",
        stufe2: "Mein Nachbar brannte 1993 und verlor die meisten seiner Bilder."
      }
    },
    wasserturm: {
      name: "Wasserturm", kurz: "Wasserturm",
      zielAntworten: ["Wasserturm", "Kapellbrücke", "Kapellbruecke", "Kapellbrücke Wasserturm", "Chapel Bridge", "Water Tower"],
      demoEnde: true
    }
  }
};

/* ========================= Speicher: Handy oder Firebase ========================= */
const app = document.getElementById("app");
let team = null, st = null, db = null, teamRef = null, online = false, adminOk = false, adminData = {}, adminBound = false;

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function fetchStore(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

function backendInit() {
  try {
    if (FIREBASE.databaseURL && window.firebase) {
      firebase.initializeApp(FIREBASE);
      db = firebase.database();
      db.ref(".info/connected").on("value", s => { online = !!s.val(); const c = document.getElementById("conn"); if (c) c.className = "conn" + (online ? " on" : ""); });
    }
  } catch (e) { console.warn("Firebase nicht gestartet:", e); db = null; }
}
function freshState() { return { rev: 0, idx: 0, phase: "ziel", tasks: {}, punkte: 0, strafen: 0, log: [], start: Date.now(), lastSeen: Date.now() }; }
function normalize(s) {
  s = s || freshState();
  s.tasks = s.tasks || {}; s.log = s.log || []; s.rev = s.rev || 0;
  Object.values(s.tasks).forEach(t => { t.trivia = t.trivia || []; t.triviaT = t.triviaT || []; });
  return s;
}
function save() {
  st.rev = (st.rev || 0) + 1; st.lastSeen = Date.now();
  store("sj_" + team, st); store("sj_current", team);
  if (teamRef) teamRef.set(JSON.parse(JSON.stringify(st)));
}
function logEv(text, kind) { st.log.push({ t: Date.now(), text, kind: kind || "" }); save(); }
function fmt(t) { return new Date(t).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); }
function ago(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "gerade eben" : `vor ${m} Min.`; }

async function loginTeam(k) {
  team = k;
  if (db) {
    teamRef = db.ref("teams/" + k);
    const snap = await teamRef.once("value");
    st = normalize(snap.exists() ? snap.val() : null);
    if (!snap.exists()) logEv("Eingeloggt"); else { logEv("Weiteres Handy eingeloggt"); }
    teamRef.on("value", s => {
      if (!s.exists()) return;
      const inc = normalize(s.val());
      if (inc.rev !== st.rev) { st = inc; store("sj_" + team, st); render(); }
    });
  } else {
    st = normalize(fetchStore("sj_" + k));
    if (!st.log.length) logEv("Eingeloggt"); else save();
  }
  render();
}
function logout() {
  if (teamRef) teamRef.off();
  teamRef = null; team = null; st = null; store("sj_current", null); render();
}

/* ========================= Hilfsfunktionen ========================= */
function station() { return CONFIG.stationen[CONFIG.teams[team].stationen[st.idx]]; }
function stationId() { return CONFIG.teams[team].stationen[st.idx]; }
function taskState() {
  const id = stationId();
  if (!st.tasks[id]) st.tasks[id] = { zahl: false, trivia: [], triviaT: [], triviaIdx: 0, foto: false, hinweis: false, versuche: 0 };
  return st.tasks[id];
}
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss").replace(/[^a-z0-9]/g, ""); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function isSkip(input) { return norm(input) === norm(CONFIG.spielleiterCode); }
function matchText(input, answers) {
  const n = norm(input); if (!n) return false;
  return answers.some(a => { const m = norm(a); if (n === m) return true; const tol = m.length >= 10 ? 2 : (m.length >= 6 ? 1 : 0); return lev(n, m) <= tol; });
}
function matchNumber(input, answer) { const d = String(input).replace(/[^0-9]/g, ""); return d.length > 0 && d === String(answer).replace(/[^0-9]/g, ""); }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function wrong(label, val, box, block, text) {
  taskState().versuche++;
  logEv(`Falsch (${label}): «${String(val).trim().slice(0, 40)}»`, "bad");
  box.innerHTML = `<div class="msg err">${text}</div>`;
  block.classList.remove("shake"); void block.offsetWidth; block.classList.add("shake");
}

/* ========================= Spielfluss (auch für Spielleitung «Freischalten») ========================= */
function advance(byGm) {
  const s = station(); const ts = taskState(); const P = CONFIG.punkte; const pre = byGm ? "Spielleitung: " : "";
  if (st.phase === "ziel") {
    st.punkte += P.ziel; logEv(pre + "Ziel erkannt: " + s.name, byGm ? "gm" : "");
    st.phase = s.demoEnde ? "ende" : "aufgaben"; save(); return;
  }
  if (st.phase === "aufgaben") {
    if (!ts.zahl) { ts.zahl = true; ts.zahlT = Date.now(); st.punkte += P.zahl; logEv(pre + "Römische Zahlen gelöst", byGm ? "gm" : ""); save(); return; }
    const q = s.trivia.fragen;
    if (ts.triviaIdx < q.length) { const i = ts.triviaIdx; ts.trivia[i] = true; ts.triviaT[i] = Date.now(); ts.triviaIdx = i + 1; st.punkte += P.triviaProFrage; logEv(pre + `Trivia ${i + 1} gelöst`, byGm ? "gm" : ""); save(); return; }
    if (!ts.foto) { ts.foto = true; ts.fotoT = Date.now(); st.punkte += P.foto; logEv(pre + "Teamfoto gemeldet", byGm ? "gm" : ""); save(); return; }
    logEv(pre + "Station abgeschlossen: " + s.name, byGm ? "gm" : ""); st.idx++; st.phase = "ziel"; save();
  }
}

/* ========================= Rendering ========================= */
function render() {
  if (location.hash === "#admin") return renderAdmin();
  app.className = "wrap"; app.innerHTML = "";
  if (!team) return renderLogin();
  if (st.phase === "ende") return renderEnde();
  app.appendChild(topbar()); app.appendChild(lineStrip());
  if (st.phase === "ziel") renderZiel(); else renderAufgaben();
  app.appendChild(el(`<div class="foot"><span class="conn${online ? " on" : ""}" id="conn"></span>${db ? "Spielstand wird für das ganze Team gespeichert." : "Spielstand ist nur auf diesem Handy gespeichert."} <button type="button" id="reset">Neu starten (nur zum Testen)</button></div>`));
  document.getElementById("reset").onclick = () => {
    if (confirm("Wirklich alles zurücksetzen? Der Spielstand des ganzen Teams geht verloren.")) { st = freshState(); save(); logout(); }
  };
}
function topbar() {
  const t = CONFIG.teams[team]; const total = st.punkte - st.strafen;
  return el(`<div class="topbar"><strong>${esc(t.anzeige)}</strong><span class="score">${total} Punkte${st.strafen ? ` <span class="muted small">(−${st.strafen})</span>` : ""}</span></div>`);
}
function lineStrip() {
  const ids = CONFIG.teams[team].stationen;
  const stops = ids.map((id, i) => {
    const cls = i < st.idx ? "done" : (i === st.idx ? "now" : "");
    const name = CONFIG.stationen[id].kurz || CONFIG.stationen[id].name;
    return `<div class="stop ${cls}"><div class="dot"></div><div class="label">${esc(i === st.idx && st.phase === "ziel" ? "?" : name)}</div></div>`;
  }).join("");
  return el(`<div class="line"><div class="track"></div><div class="stops">${stops}</div></div>`);
}
function renderLogin() {
  const v = el(`
    <div>
      <h1>Schnitzeljagd Luzern</h1>
      <p class="muted">Teamname und Code stehen in eurem Umschlag.</p>
      <div class="block active">
        <div id="loginMsg"></div>
        <label for="tn">Teamname</label><input type="text" id="tn" autocomplete="off" autocapitalize="none">
        <label for="tc">Code</label><input type="tel" id="tc" autocomplete="off">
        <button class="btn" id="go">Los geht’s</button>
      </div>
    </div>`);
  app.appendChild(v);
  const go = () => {
    const name = norm(document.getElementById("tn").value); const code = document.getElementById("tc").value.trim();
    const hit = Object.keys(CONFIG.teams).find(k => norm(k) === name && CONFIG.teams[k].code === code);
    if (!hit) { document.getElementById("loginMsg").innerHTML = `<div class="msg err">Teamname oder Code stimmt nicht. Schaut nochmals in den Umschlag.</div>`; return; }
    document.getElementById("go").textContent = "Lade Spielstand …"; loginTeam(hit);
  };
  document.getElementById("go").onclick = go;
  v.querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
}
function renderZiel() {
  const s = station(); const n = st.idx + 1; const ts = taskState();
  const prev = st.idx > 0 ? CONFIG.stationen[CONFIG.teams[team].stationen[st.idx - 1]] : null;
  const raetselHtml = (prev && prev.raetsel)
    ? `<div class="block"><h3>Das Rätsel</h3><div class="riddle">${esc(prev.raetsel.stufe1)}</div>
       ${ts.hinweis ? `<div class="riddle hint">${esc(prev.raetsel.stufe2)}</div>` : `<button class="btn quiet" id="hint">Hinweis anzeigen (−${CONFIG.punkte.hinweisStrafe} Punkte)</button>`}</div>`
    : `<p class="muted">Das Rätsel zu dieser Station liegt im Umschlag.</p>`;
  const v = el(`
    <div><h2>Station ${n}: Wohin geht’s?</h2>${raetselHtml}
      <div class="block active" id="zielBlock"><div id="zielMsg"></div>
        <label for="ziel">Euer Ziel</label><input type="text" id="ziel" autocomplete="off" placeholder="Name des Ortes">
        <button class="btn" id="zielGo">Prüfen</button></div></div>`);
  app.appendChild(v);
  const hint = document.getElementById("hint");
  if (hint) hint.onclick = () => { ts.hinweis = true; st.strafen += CONFIG.punkte.hinweisStrafe; logEv("Hinweis geöffnet (Station " + n + ")"); render(); };
  const go = () => {
    const val = document.getElementById("ziel").value;
    if (isSkip(val) || matchText(val, s.zielAntworten)) { advance(isSkip(val)); render(); }
    else wrong("Ziel", val, document.getElementById("zielMsg"), document.getElementById("zielBlock"), "Das ist es nicht. Nochmals lesen, nochmals probieren.");
  };
  document.getElementById("zielGo").onclick = go;
  document.getElementById("ziel").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
let justStamped = null;
function renderAufgaben() {
  const s = station(); const ts = taskState();
  const q = s.trivia.fragen;
  const triviaDone = ts.triviaIdx >= q.length;
  const allDone = ts.zahl && triviaDone && ts.foto;
  const stampHtml = (t) => `<div class="stamp ${t === justStamped ? "fresh" : ""}">Erledigt ${fmt(t)}</div>`;
  app.appendChild(el(`<div><h2>${esc(s.name)}</h2><p class="muted">Ihr seid da. Drei Aufgaben, die Reihenfolge ist euch überlassen: das Foto geht parallel.</p></div>`));

  const b1 = el(`<div class="block ${ts.zahl ? "done" : "active"}">${ts.zahl ? stampHtml(ts.zahlT) : ""}<h3>Römische Zahlen</h3><p>${esc(s.zahl.frage)}</p>
    ${ts.zahl ? "" : `<div id="zahlMsg"></div><input type="tel" id="zahl" autocomplete="off" placeholder="Summe"><button class="btn" id="zahlGo">Prüfen</button>`}</div>`);
  app.appendChild(b1);
  if (!ts.zahl) {
    const go = () => { const val = document.getElementById("zahl").value;
      if (isSkip(val) || matchNumber(val, s.zahl.antwort)) { advance(isSkip(val)); justStamped = ts.zahlT; render(); }
      else wrong("Summe", val, document.getElementById("zahlMsg"), b1, "Stimmt nicht. Habt ihr alle vier Zahlen? Und die Umrechnung geprüft?"); };
    document.getElementById("zahlGo").onclick = go;
    document.getElementById("zahl").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }

  const wa = CONFIG.whatsappNummer
    ? `<a class="btn ghost" style="margin-bottom:.6rem" href="https://wa.me/${CONFIG.whatsappNummer}?text=${encodeURIComponent(s.foto.whatsappText)}" target="_blank" rel="noopener">Foto per WhatsApp an die Spielleitung</a>`
    : `<p class="small muted">Schickt das Foto per WhatsApp an die Spielleitung (Nummer im Umschlag).</p>`;
  const b2 = el(`<div class="block ${ts.foto ? "done" : "active"}">${ts.foto ? stampHtml(ts.fotoT) : ""}<h3>Teamfoto</h3><p>${esc(s.foto.text)}</p>
    ${ts.foto ? "" : wa + `<label class="check"><input type="checkbox" id="fotoChk"> Foto ist gemacht und an die Spielleitung geschickt</label>`}</div>`);
  app.appendChild(b2);
  if (!ts.foto) document.getElementById("fotoChk").onchange = (e) => { if (!e.target.checked) return;
    ts.foto = true; ts.fotoT = Date.now(); st.punkte += CONFIG.punkte.foto; justStamped = ts.fotoT; logEv("Teamfoto gemeldet"); render(); };

  if (!ts.zahl) {
    app.appendChild(el(`<div class="block locked"><h3>Trivia</h3><p>Wird freigeschaltet, sobald die Summe stimmt.</p></div>`));
  } else {
    const i = ts.triviaIdx;
    const doneList = q.slice(0, i).map((f, k) => `<dt>${esc(f.frage)}</dt><dd>Gelöst ${fmt(ts.triviaT[k])}</dd>`).join("");
    const b3 = el(`<div class="block ${triviaDone ? "done" : "active"}">${triviaDone ? stampHtml(ts.triviaT[q.length - 1]) : ""}
      <h3>Trivia${triviaDone ? "" : ` ${i + 1} von ${q.length}`}</h3>${triviaDone ? "" : `<p class="muted small">${esc(s.trivia.intro)}</p>`}
      ${doneList ? `<dl>${doneList}</dl>` : ""}
      ${triviaDone ? "" : `<p style="margin-top:.8rem"><strong>${esc(q[i].frage)}</strong></p><div id="trMsg"></div>
        <input type="text" id="tr" autocomplete="off" placeholder="Antwort"><button class="btn" id="trGo">Prüfen</button>`}</div>`);
    app.appendChild(b3);
    if (!triviaDone) {
      const go = () => { const val = document.getElementById("tr").value;
        if (isSkip(val) || matchText(val, q[i].antworten)) { advance(isSkip(val)); justStamped = ts.triviaT[i]; render(); }
        else wrong(`Trivia ${i + 1}`, val, document.getElementById("trMsg"), b3, "Nein. Die Tafel nochmals genau lesen."); };
      document.getElementById("trGo").onclick = go;
      document.getElementById("tr").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
  }
  if (allDone) {
    const b4 = el(`<div class="block active"><h3>Alles erledigt</h3><p>Das Rätsel zur nächsten Station wartet.</p><button class="btn" id="next">Rätsel anzeigen</button></div>`);
    app.appendChild(b4);
    document.getElementById("next").onclick = () => { advance(false); render(); };
  }
  justStamped = null;
}
function renderEnde() {
  const t = CONFIG.teams[team]; const total = st.punkte - st.strafen; const mins = Math.round((Date.now() - st.start) / 60000);
  const v = el(`<div><h1>Ende der Testversion</h1><p class="muted">Ab hier kämen die Aufgaben der nächsten Station.</p>
    <div class="block done"><h3>${esc(t.anzeige)}</h3><dl><dt>Punkte</dt><dd>${total} (davon ${st.strafen} Strafpunkte)</dd><dt>Spielzeit</dt><dd>${mins} Minuten</dd></dl></div>
    <div class="block"><h3>Protokoll</h3><p class="small muted">Zeigt diesen Bildschirm am Schluss der Spielleitung.</p><ul class="log">${logHtml(st.log)}</ul></div>
    <button class="btn quiet" id="reset2">Neu starten (nur zum Testen)</button></div>`);
  app.appendChild(v);
  document.getElementById("reset2").onclick = () => { st = freshState(); save(); logout(); };
}
function logHtml(log) { return (log || []).map(e => `<li class="${e.kind || ""}">${fmt(e.t)} – ${esc(e.text)}</li>`).join(""); }

/* ========================= Spielleitung: #admin ========================= */
function renderAdmin() {
  app.className = "wrap wide"; app.innerHTML = "";
  if (!adminOk) {
    const v = el(`<div><h1>Spielleitung</h1><div class="block active"><div id="aMsg"></div><label for="ac">Spielleiter-Code</label>
      <input type="password" id="ac"><button class="btn" id="aGo">Öffnen</button></div></div>`);
    app.appendChild(v);
    const go = () => { if (norm(document.getElementById("ac").value) === norm(CONFIG.spielleiterCode)) { adminOk = true; bindAdmin(); }
      else document.getElementById("aMsg").innerHTML = `<div class="msg err">Code stimmt nicht.</div>`; };
    document.getElementById("aGo").onclick = go;
    document.getElementById("ac").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    return;
  }
  drawAdmin();
}
function bindAdmin() {
  if (db) { if (!adminBound) { adminBound = true; db.ref("teams").on("value", s => { adminData = s.val() || {}; drawAdmin(); }); } else drawAdmin(); }
  else { adminData = {}; Object.keys(CONFIG.teams).forEach(k => { const v = fetchStore("sj_" + k); if (v) adminData[k] = v; }); drawAdmin(); }
}
function drawAdmin() {
  if (location.hash !== "#admin") return;
  app.className = "wrap wide"; app.innerHTML = "";
  app.appendChild(el(`<div class="topbar"><strong>Spielleitung</strong><span class="small muted">${db ? "Live aus der Datenbank" : "Nur Spielstände dieses Handys (kein Firebase konfiguriert)"}</span></div>`));
  const grid = el(`<div class="teamgrid"></div>`);
  Object.keys(CONFIG.teams).forEach(k => {
    const t = CONFIG.teams[k]; const d = adminData[k] ? normalize(JSON.parse(JSON.stringify(adminData[k]))) : null;
    let status = "Noch nicht eingeloggt", ticks = "", logs = "", btn = "";
    if (d) {
      const sid = t.stationen[Math.min(d.idx, t.stationen.length - 1)]; const s = CONFIG.stationen[sid];
      if (d.phase === "ende") status = "Fertig";
      else if (d.phase === "ziel") status = `Sucht Station ${d.idx + 1} (${s.name})`;
      else status = `An Station ${d.idx + 1}: ${s.name}`;
      const ts = d.tasks[sid];
      if (ts && d.phase === "aufgaben") {
        const nq = (s.trivia ? s.trivia.fragen.length : 0);
        ticks = `Zahl <b>${ts.zahl ? "✓" : "–"}</b> · Trivia <b>${ts.triviaIdx || 0}/${nq}</b> · Foto <b>${ts.foto ? "✓" : "–"}</b>`;
      }
      const lg = d.log.slice().reverse();
      logs = `<details><summary class="small">Protokoll (${lg.length} Einträge, letzte zuerst)</summary><ul class="log">${logHtml(lg)}</ul></details>`;
      if (d.phase !== "ende") btn = `<button class="btn sm ghost" data-skip="${k}" style="margin-top:.6rem">Nächsten Schritt freischalten</button>`;
    }
    grid.appendChild(el(`<div class="block ${d ? "active" : "locked"}"><h3>${esc(t.anzeige)}</h3>
      <div class="status">${esc(status)}</div>${ticks ? `<div class="ticks">${ticks}</div>` : ""}
      ${d ? `<div class="small muted">${d.punkte - d.strafen} Punkte · zuletzt aktiv ${ago(d.lastSeen || d.start)}</div>` : ""}
      ${logs}${btn}</div>`));
  });
  app.appendChild(grid);
  app.appendChild(el(`<p class="foot">Zum Spiel zurück: #admin aus der Adresse löschen und neu laden.</p>`));
  grid.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => gmSkip(b.getAttribute("data-skip")));
}
async function gmSkip(k) {
  if (!confirm(`${CONFIG.teams[k].anzeige}: nächsten Schritt freischalten?`)) return;
  const saveTeam = team, saveSt = st, saveRef = teamRef;
  team = k;
  if (db) { teamRef = db.ref("teams/" + k); const snap = await teamRef.once("value"); st = normalize(snap.exists() ? snap.val() : null); }
  else { st = normalize(fetchStore("sj_" + k)); teamRef = null; }
  advance(true);
  team = saveTeam; st = saveSt; teamRef = saveRef;
  if (!db) bindAdmin();
}

/* ========================= Start ========================= */
window.addEventListener("hashchange", () => { if (location.hash === "#admin") renderAdmin(); else render(); });
(function init() {
  backendInit();
  const cur = fetchStore("sj_current");
  if (location.hash === "#admin") return renderAdmin();
  if (cur && CONFIG.teams[cur]) loginTeam(cur); else render();
})();
</script>
</body>
